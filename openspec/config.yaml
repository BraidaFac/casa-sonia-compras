schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Casa Sonia Compras. App interna (Next.js 16 App Router, React 19, Mantine 9 dark/amber,
  TanStack Query 5, Prisma + MariaDB) integrada con Odoo 19 vía JSON-2 API (src/lib/odoo.ts).
  Odoo es la fuente de verdad de productos, stock y órdenes; la DB local guarda borradores,
  empleados, historial y configuración comercial.
  Roles: ADMIN, MANAGER, EMPLEADO ("Encargado"), EMPLEADO_BASICO ("Empleado"). Los permisos se
  aplican en tres lugares que deben quedar alineados: src/proxy.ts, withAuth({roles}) en cada API
  y los filtros de src/components/layout/Sidebar.tsx.
  Convenciones: un hook React Query por entidad en src/hooks, claves en src/lib/queryKeys.ts;
  modelos Prisma nuevos en español con creadoPorId/creadoEn/actualizadoEn; sin framework de tests.
  Arquitectura y matriz de permisos vigentes: docs/arquitectura.md.

rules:
  proposal:
    - Declarar qué roles acceden y qué modelos de Odoo se leen/escriben
    - Explicitar qué queda fuera de alcance


# Per-operation guidance (optional)
